name = "cfip"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源（Workers Assets）
# ip2region xdb（约 11MB）存放于 public/data/，随资产部署，
# Worker 经 ASSETS 绑定按需加载（模块级记忆化，每 isolate 一次）——无需 KV
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
# 查询结果缓存时长（秒），默认 6 小时
CACHE_TTL_SEC = "21600"
# DNSBL 黑名单缓存时长（秒），默认 1 小时
DNSBL_TTL_SEC = "3600"
# ip-api.com 免费档禁止商业用途，作为二级降级源，可一键关闭
ENABLE_IPAPI = "true"
# 上游请求超时（毫秒）
UPSTREAM_TIMEOUT_MS = "6000"

# 站点绝对地址：canonical / og:url / sitemap / robots 里的 Sitemap 行都用它。
# 留空 = 取请求的 origin（workers.dev 与自定义域都能自洽）；
# 若同时有多个域名入口，建议固定为主域名，避免重复内容。
# SITE_URL = "https://ip.example.com"

# —— HTML <head> 代码注入（搜索引擎验证 meta 等）——
# 留空/注释 = 不注入。内容会原样插入 index.html 的 <!--HEAD_INJECT--> 处。
# 多行用 TOML 多行字符串（三个双引号），例如：
# HEAD_INJECT = """
#   <meta name="google-site-verification" content="xxxxxxxx">
#   <meta name="msvalidate.01" content="xxxxxxxx">
#   <meta name="baidu-site-verification" content="codeva-xxxx">
# """
# 非公开来源的内容请改用 `npx wrangler secret put HEAD_INJECT`，避免进仓库。


# 可选数据源（不配置则对应适配器自动停用）：
#   npx wrangler secret put IPINFO_TOKEN    # ipinfo.io（5 万次/月免费）
#   npx wrangler secret put ABUSEIPDB_KEY   # AbuseIPDB（1000 次/天免费）

# 可选统计 / 广告（公开 ID，非 secret；非空时覆盖前端 public/assets/site-config.js）
# 也可直接改 site-config.js，无需动这里。留空/注释 = 关闭，保持零外部请求。
# [vars]
# SITE_GA4_ID = "G-XXXXXXXXXX"
# SITE_BING_UET = "12345678"
# SITE_BAIDU_ID = "0123456789abcdef0123456789abcdef"
# SITE_CF_ANALYTICS_TOKEN = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# ADSENSE_CLIENT = "ca-pub-XXXXXXXXXXXXXXXX"
# ADSENSE_SLOT_AFTER_RESULT = "1234567890"
# ADSENSE_SLOT_BEFORE_FOOTER = "0987654321"
