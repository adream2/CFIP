name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 无锁文件（package-lock.json 不入库）：用 actions/cache 按 package.json 哈希缓存 npm 下载目录
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - run: npm install
      - name: 类型检查
        run: npx tsc --noEmit
      - name: 单元测试
        run: npx vitest run
